<!-- Production stylesheet, downloaded verbatim from my.saleshandy.com/assets/index-BTykneNi.css on 11 Oct 2026
     (webui main 2ae90d3). Only the icon-font URLs were repointed to the local copies beside it.
     Markup below uses production's own class names, captured from the live /conversations page. -->
<link rel="stylesheet" href="prod/index.css">
<style>
/* ───────── prototype-only styles. Everything production does not have is prefixed nx- ───────── */
html,body{height:100%;margin:0}
body{font-family:Inter,sans-serif;background:#fff;overflow:hidden}
.demo{height:44px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 16px;background:#1f2937;color:#fff;font-size:12px;line-height:16px;position:relative;z-index:2000}
.demo .t{color:#9ca3af;font-weight:500}
.demo .seg{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:4px;overflow:hidden}
.demo .seg button{background:none;border:0;color:#d1d5db;padding:4px 10px;font:500 12px Inter,sans-serif;cursor:pointer}
.demo .seg button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}
.demo select{font:12px Inter,sans-serif;background:#374151;color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:3px 6px}
.demo .btnr{background:none;color:#d1d5db;border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:4px 8px;font:500 12px Inter,sans-serif;cursor:pointer}
.demo label{margin:0}
.demo label.tg{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.demo .key{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:#c4b5fd}
.demo .key i{width:14px;height:10px;border:2px dashed #a78bfa;border-radius:3px;display:inline-block}

/* "What's new" highlight: every element production does not have carries .nx-new */
.show-new .nx-new{outline:2px dashed #8b5cf6;outline-offset:2px;border-radius:4px}
.show-new .nx-new-block{box-shadow:inset 0 0 0 2px #c4b5fd}

.stage{height:calc(100vh - 44px);display:flex;min-height:0}
.web{flex:1;min-width:0;display:flex;height:100%}
.nx-rail{width:57px;flex-shrink:0;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:#fff}
.nx-rail .lg{width:24px;height:24px;margin-bottom:12px;color:#1d4ed8}
.nx-rail a{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#1f2937}
.nx-rail a.on{background:#1d4ed8;color:#fff}
.nx-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.nx-pagehdr{height:50px;flex-shrink:0;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #e5e7eb;background:#fff}
.nx-pagehdr h2{margin:0;font-size:16px;line-height:24px;font-weight:600;color:#1f2937}
.nx-pagehdr .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#1f2937}
.nx-pagehdr .me .shd-avatar{margin:0}
.unified-inbox{min-height:0}
.unified-inbox-mail-list{position:relative}

/* new: label pills in a fixed-height row and in the thread header */


.nx-more{font-size:10px;line-height:18px;font-weight:500;color:#6b7280;border:1px solid #e5e7eb;background:#fff;border-radius:2px;padding:0 4px;margin-left:4px}
.mail-item .unified-inbox-unSubScribed .d-flex{flex-wrap:nowrap;overflow:hidden}
/* production fades rows in once on load; the prototype re-renders on every click, so the replay is switched off */
.unified-inbox-content .mail-item{animation:none}
.mail-item .shd-pills .pills-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-item .sequence-pill{flex-shrink:1;min-width:48px;max-width:100%}
.mail-item .email-category,.mail-item .nx-lpill,.mail-item .nx-more{flex-shrink:0}

/* labels on their own line: labelled rows grow from production's 106px; unlabelled rows are untouched */
.unified-inbox-content .mail-item.nx-has-labels{height:138px}
.mail-item.nx-has-labels .unified-inbox-unSubScribed{flex-wrap:wrap}
.nx-labelline{display:flex;align-items:center;gap:4px;margin-top:6px;overflow:hidden;flex-wrap:nowrap;flex-basis:100%;width:100%;min-width:0}





.nx-more{margin:0;flex-shrink:0}
.nx-hlabels{gap:6px;flex-shrink:0}
/* design-system tags (ProspectTag, bs-tag bs-tag-blue-17) and the tag-button from AddRemoveTag; only spacing is set here */
.nx-labelline .bs-tag,.nx-hlabels .bs-tag{margin:0;max-width:150px}
/* rows use the design system's compact tag size (12px/18px, as in .prospect-sequence-list-container .bs-tag) */
.nx-labelline .bs-tag .regular-2{font-size:12px;line-height:18px;font-weight:500}
.nx-labelline .bs-tag .regular-2,.nx-hlabels .bs-tag .nx-tagname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx-labelline .bs-tag[data-act],.nx-hlabels .nx-tagname{cursor:pointer}
.nx-labelline .bs-tag[data-act]:hover,.nx-hlabels .nx-tagname:hover{text-decoration:underline}
.nx-hlabels .sh-close{cursor:pointer;font-size:10px;color:#6b7280}
.nx-hlabels .sh-close:hover{color:#1f2937}
.nx-hlabels .tag-button{font-family:Inter,sans-serif}
.nx-hlabels .tag-button.open{border-color:#1d4ed8!important;color:#1d4ed8!important}
.m-pill.lab{border:0;background:#eff6ff;color:#1f2937;cursor:pointer}
.unified-inbox-mail-header--left{min-width:0;flex:1 1 auto}
.unified-inbox-mail-header--left>.d-flex{min-width:0}
.unified-inbox-mail-subject{min-width:0;overflow:hidden}
.unified-inbox-mail-subject span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unified-inbox-mail-header--right{flex-shrink:0}
.unified-inbox-mail-header--left>.gap-8{flex-shrink:0}
.unified-inbox-mail-header--left .shd-pills .pills-label{white-space:nowrap}
.unified-inbox-mail-header--right .email-category-renderer{white-space:nowrap}
@media (max-width:1300px){.demo .key{display:none}}








/* bootstrap stacking: backdrop under the modal it belongs to */
#overlay .modal-backdrop{z-index:1040}
#overlay .modal{z-index:1050;top:44px;height:calc(100% - 44px)}
#overlay .modal-backdrop{top:44px}
/* production slides the drawer in once; the prototype redraws on every click, so the slide plays only when it opens */
#overlay .prospects-filters-modal.nx-settled{animation:none}
/* production fades a message body in when it is expanded; redraws here would replay it on every click */
.unified-inbox-mail-threads .accordion__panel{animation:none}
#overlay .prospects-filters-modal .modal-dialog{height:100%}
.nx-banner .btn-solid svg{margin-right:6px}
.nx-who{color:#374151;font-weight:500}
.nx-delby{display:inline-flex;align-items:center;gap:4px;font-size:10px;line-height:16px;font-weight:500;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:2px;padding:1px 5px;white-space:nowrap}

/* labels control beside Outcome, same box as production's select */
.nx-anchor{position:relative;display:flex;align-items:center}
.unified-inbox-mail-header--right{gap:12px}
.mail-action-btn{color:#6b7280}
.mail-action-btn:hover{color:#1f2937}
.mail-action-btn.nx-del:hover{color:#b91c1c}

/* production transfer dropdown, positioned under its control */
.nx-pop{position:absolute;top:calc(100% + 6px);right:0;z-index:50;width:264px}
.nx-pop .transfer-container{background:#fff;border:1px solid #e5e7eb;border-radius:4px;box-shadow:0 2px 12px rgba(31,41,55,.12)}
.nx-pop .transfer-body{padding:8px}
.nx-pop .transfer-search .bs-input-affix-wrapper{width:100%}
.nx-pop .transfer-list{list-style:none;margin:6px 0 0;padding:0;max-height:260px;overflow:auto}
.nx-pop .transfer-list li{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:14px;color:#1f2937}
.nx-pop .transfer-list li:hover{background:#f3f4f6}
.nx-pop .transfer-list li.active{background:#eff6ff;color:#1d4ed8}
.nx-pop .transfer-list li .k{margin-left:auto;font-size:12px;color:#6b7280}
.nx-pop .transfer-list li.nx-add{color:#1d4ed8;font-weight:500}
.nx-pop .nx-hint{font-size:12px;line-height:16px;color:#6b7280;padding:8px 8px 2px;border-top:1px solid #f3f4f6;margin-top:6px}
.nx-pop .nx-form{display:flex;flex-direction:column;gap:10px;padding:4px}
.nx-pop .nx-form .ttl{font-weight:600;font-size:14px;color:#1f2937}
.nx-pop .nx-form input{height:32px;border:1px solid #1d4ed8;box-shadow:0 0 0 3px #dbeafe;border-radius:4px;padding:0 8px;font:14px Inter,sans-serif;outline:0}
.nx-pop .nx-form input.err{border-color:#b91c1c;box-shadow:0 0 0 3px #fee2e2}
.nx-pop .nx-form .er{font-size:12px;color:#b91c1c}
.nx-pop .nx-form .btns{display:flex;justify-content:flex-end;gap:8px}
.nx-cbx{width:16px;height:16px;border-radius:3px;border:1.5px solid #9ca3af;box-sizing:border-box;position:relative;flex-shrink:0;display:inline-block}
.nx-cbx.on{background:#1d4ed8;border-color:#1d4ed8}
.nx-cbx.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(40deg)}

/* new: who sent a team reply, and activity lines in the thread */
.nx-sentby{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:11px;line-height:16px;font-weight:500;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:0 8px;vertical-align:middle}
.nx-sentby.seq{color:#4b5563;background:#f3f4f6;border-color:#e5e7eb}
.nx-sentby.ext{color:#92400e;background:#fffbeb;border-color:#fde68a}
.nx-act{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:#6b7280;margin:0 0 14px}
.nx-act i{flex:1;height:1px;background:#e5e7eb}
.nx-act b{color:#374151;font-weight:600}
.nx-act.red{color:#b91c1c}.nx-act.red b{color:#b91c1c}.nx-act.red i{background:#fecaca}
.nx-act .shd-avatar{margin:0}
.nx-banner{display:flex;align-items:center;gap:12px;padding:10px 24px;background:#fef2f2;border-bottom:1px solid #fecaca;color:#991b1b;font-size:14px;flex-wrap:wrap}
.nx-banner .btn-solid{margin-left:auto}
.nx-replybtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid #1d4ed8;color:#1d4ed8;background:#fff;border-radius:4px;font:500 14px Inter,sans-serif;cursor:pointer;margin:2px 0 24px}
.nx-composer{border:1px solid #d1d5db;border-radius:8px;background:#fff;margin:2px 0 24px}
.nx-composer textarea{display:block;width:100%;border:0;outline:0;resize:none;padding:12px 14px;min-height:88px;font:14px/20px Inter,sans-serif;border-radius:8px 8px 0 0}
.nx-composer .cb{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #f3f4f6;font-size:12px;color:#6b7280}
.nx-composer .cb .btn-ghost{margin-left:auto}
.nx-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:6px;padding:10px 16px;display:flex;gap:16px;align-items:center;font-size:14px;z-index:3000;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.nx-toast button{background:none;border:0;color:#93c5fd;font:500 14px Inter,sans-serif;cursor:pointer;padding:0}
.nx-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#6b7280;font-size:14px}
.nx-empty b{color:#1f2937;font-size:16px}

/* filters drawer: production modal shell; react-select boxes redrawn from their computed styles */
.nx-sel{position:relative}
.nx-sel .ctl{min-height:38px;border:1px solid #e5e7eb;border-radius:4px;background:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 40px 4px 10px;cursor:pointer;font-size:14px;color:#6b7280;position:relative}
.nx-sel .ctl::after{content:"";position:absolute;right:34px;top:8px;bottom:8px;width:1px;background:#ccc}
.nx-sel .ctl .chev{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#ccc;display:flex}
.nx-sel .chipv{display:inline-flex;align-items:center;gap:4px;background:#f3f4f6;border-radius:2px;padding:1px 6px;font-size:12px;color:#1f2937}
.nx-sel .opts{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #e5e7eb;border-radius:4px;box-shadow:0 4px 14px rgba(31,41,55,.12);z-index:5;padding:4px;max-height:240px;overflow:auto}
.nx-sel .opts div{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:4px;cursor:pointer;font-size:14px;color:#1f2937}
.nx-sel .opts div:hover{background:#f3f4f6}
.nx-sel .opts .k{margin-left:auto;color:#6b7280;font-size:12px}
.nx-radios{display:flex;gap:16px;font-size:14px;color:#1f2937}
.nx-radios span{display:inline-flex;align-items:center;gap:6px}
.nx-radios i{width:14px;height:14px;border-radius:50%;border:1px solid #d1d5db;display:inline-block}
.nx-radios i.on{border:4px solid #1d4ed8}
.nx-applied{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid #eaedef;background:#fff;font-size:12px}
.nx-applied .fc{display:inline-flex;align-items:center;gap:6px;border:1px solid #e5e7eb;border-radius:14px;padding:2px 4px 2px 10px;color:#374151;background:#f9fafb}
.nx-applied .fc b{font-weight:600}
.nx-applied .fc button{border:0;background:none;color:#6b7280;cursor:pointer;width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
.nx-applied .fc button:hover{background:#e5e7eb}
.nx-applied .clr{color:#1d4ed8;font-weight:500;cursor:pointer;background:none;border:0;font-size:12px}
.nx-confirm .modal-dialog{max-width:460px}
.nx-confirm .who{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;color:#4b5563;margin:12px 0}
.nx-confirm .who .shd-avatar{margin:0}
.nx-btn-danger{display:inline-flex;align-items:center;height:32px;padding:0 16px;border-radius:4px;background:#b91c1c;color:#fff;border:0;font:500 14px Inter,sans-serif;cursor:pointer}
.nx-btn-danger:hover{background:#991b1b}

/* ───────── mobile app frame (drawn from the app's help-centre screenshots) ───────── */
.mob-wrap{display:flex;align-items:flex-start;justify-content:center;gap:32px;padding:24px;overflow:auto;background:#eef2ff;height:100%;box-sizing:border-box;flex-wrap:wrap;flex:1}
.both .mob-wrap{flex:0 0 470px;border-left:1px solid #e5e7eb}
.phone{width:390px;height:780px;border-radius:44px;border:10px solid #c7d2fe;background:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(49,46,129,.15);font-family:Inter,sans-serif;color:#111827;flex-shrink:0}
.phone .sb{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.phone .scr{position:absolute;top:40px;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.m-top{display:flex;align-items:center;gap:10px;padding:6px 14px}
.m-search{flex:1;height:38px;border-radius:19px;background:#f3f4f6;display:flex;align-items:center;gap:8px;padding:0 14px;color:#6b7280;font-size:14px}
.m-me{width:34px;height:34px;border-radius:17px;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.m-chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none;flex-shrink:0}
.m-chips::-webkit-scrollbar{display:none}
.m-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:15px;border:1px solid #e5e7eb;font-size:12px;font-weight:500;color:#374151;background:#fff;cursor:pointer;white-space:nowrap}
.m-chip.on{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.m-chip.clr{color:#1d4ed8;border-color:#93c5fd}
.m-tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid #f3f4f6;font-size:13px;font-weight:500;color:#6b7280;flex-shrink:0}
.m-tabs span{padding:8px 0;cursor:pointer}
.m-tabs span.on{color:#1d4ed8;box-shadow:inset 0 -2px 0 #1d4ed8}
.m-list{flex:1;overflow:auto}
.m-row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f3f4f6;cursor:pointer}
.m-row .av{width:36px;height:36px;border-radius:18px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-row .b{flex:1;min-width:0}
.m-row .n{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.m-row .n .d{width:7px;height:7px;border-radius:4px;background:#2563eb}
.m-row .n .dt{margin-left:auto;font-size:12px;font-weight:400;color:#6b7280}
.m-row .s{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.m-row .p{font-size:13px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.m-row .pl{display:flex;gap:6px;margin-top:6px;overflow:hidden}
.m-pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:4px;border:1px solid #e5e7eb;font-size:11px;color:#4b5563;white-space:nowrap;flex-shrink:0}
.m-pill.pos{border-color:#86efac;background:#f0fdf4;color:#15803d}
.m-pill.neg{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
.m-pill.del{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
.m-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #f3f4f6}
.m-bar .ttl{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-ib{width:36px;height:36px;border-radius:18px;border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;color:#374151;background:#fff;cursor:pointer;flex-shrink:0;position:relative}
.m-ib .bd{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#1d4ed8;color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 3px}
.m-meta{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid #f3f4f6}
.m-thread{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:#f9fafb}
.m-msg{background:#fff;border:1px solid #eef0f3;border-radius:12px;padding:10px 12px;font-size:13px;line-height:19px;flex-shrink:0}
.m-msg .f{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:#6b7280;margin-bottom:4px}
.m-msg .f b{color:#111827}
.m-act{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7280;flex-shrink:0}
.m-act i{flex:1;height:1px;background:#e5e7eb}
.m-act b{color:#374151}
.m-act.red,.m-act.red b{color:#b91c1c}
.m-reply{padding:10px 14px;border-top:1px solid #f3f4f6;display:flex;gap:8px}
.m-reply span{flex:1;height:40px;border-radius:20px;border:1px solid #e5e7eb;display:flex;align-items:center;padding:0 14px;color:#9ca3af;font-size:14px}
.m-reply b{width:40px;height:40px;border-radius:20px;background:#1d4ed8;color:#fff;display:flex;align-items:center;justify-content:center}
.m-sheet-bg{position:absolute;inset:0;background:rgba(17,24,39,.35);z-index:5}
.m-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:6;padding:8px 0 16px;max-height:80%;overflow:auto}
.m-sheet .grab{width:40px;height:4px;border-radius:2px;background:#d1d5db;margin:0 auto 8px}
.m-sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 10px;font-size:17px;font-weight:600}
.m-sheet .hd button{background:none;border:0;font-size:22px;line-height:22px;color:#6b7280;cursor:pointer}
.m-sheet .opt{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:15px;cursor:pointer;border-top:1px solid #f9fafb}

function goStep(n) {
  const view = ui ? ui.view : 'web', showNew = ui ? ui.showNew : true;
  seed(); ui.view = view; ui.showNew = showNew; ui.step = n;
  if (n >= 2) { openThread('tom'); ui.scrollEnd = true; ui.m.screen = 'thread'; }
  if (n >= 3) { toggleLabel('tom', 'pricing'); ui.pop = 'labels'; ui.m.sheet = 'labels'; }
  if (n >= 4) { T('tom').items.push({ k: 'in', at: d(9, 10, 30), text: "One more thing: we're also talking to one of your competitors." }); ui.pop = 'labelNew'; ui.newName = 'Competitor'; ui.m.sheet = 'labelnew'; ui.m.newName = 'Competitor'; }
  if (n >= 5) {
    createLabel('Competitor', 'tom'); ui.pop = null; ui.m.sheet = null;
    T('tom').items.push({ k: 'in', at: d(9, 10, 40), text: 'Thursday at 3 works for a walkthrough. Can you send an invite?' });
    T('tom').items.push({ k: 'out', by: 'aj', at: tick(), text: "Invite sent for Thursday at 3 PM. I'll bring pricing for both plants." });
    setOutcome('tom', 'mtg'); ui.scrollEnd = true;
  }
  if (n >= 6) { ui.toast = null; openThread('ben'); ui.modal = 'delete'; ui.m.screen = 'thread'; ui.m.sheet = 'delete'; }
  if (n >= 7) { deleteThread('ben'); ui.toast = null; clock += 47 * 60e3; S.me = 'ms'; ui.feed = 'deleted'; openThread('ben'); ui.m.screen = 'thread'; }
  if (n >= 8) { ui.feed = 'all'; ui.sel = null; ui.m.screen = 'list'; ui.filters = { outcomes: [], replied: ['aj'], labels: [] }; ui.draftFilters = { outcomes: [], replied: ['aj'], labels: [] }; ui.openSel = 'replied'; ui.m.sheet = 'freplied'; }
  if (n < 5) ui.toast = null;
  render();
}

  mtogglelabel: (id) => toggleLabel(ui.sel, id),
  mcreatelabel: () => { if (createLabel(ui.m.newName, ui.sel)) { ui.m.sheet = 'labels'; ui.m.newName = ''; } },
  mpick: (id, el) => { const k = el.dataset.key; const a = ui.filters[k]; ui.filters = { ...ui.filters, [k]: a.includes(id) ? a.filter((x) => x !== id) : [...a, id] }; },
};
const KEEP_POP = ['pop', 'togglelabel', 'newlabel', 'cancelnew', 'outcome'];
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  const inPop = e.target.closest('.nx-pop, .nx-sel');
  if (el && el.dataset.act === 'labelfilter') e.stopPropagation();
  if (!el) { if (!inPop && (ui.pop || ui.openSel)) { ui.pop = null; ui.openSel = null; render(); } return; }
  const act = el.dataset.act; if (act === 'step') return;
  // the modal wrapper spans the page: only a click on the dimmed area itself closes it
  if ((act === 'closefilters' || act === 'closemodal') && el.classList.contains('modal') && e.target !== el) return;
  if (el.tagName === 'A') e.preventDefault();
  if (!KEEP_POP.includes(act)) ui.pop = null;
  if (!['openselect', 'pickfilter'].includes(act)) ui.openSel = null;
  if (ACT[act]) ACT[act](el.dataset.id, el);
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (ui.modal) ui.modal = null; else if (ui.draftFilters) ui.draftFilters = null; else if (ui.pop) ui.pop = null; else if (ui.m.sheet) ui.m.sheet = null; else return; render(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.target.id === 'labelq' && e.key === 'Enter') {
    e.preventDefault(); const q = ui.labelQuery.trim(); if (!q) return;
    const hit = S.labels.find((l) => l.name.toLowerCase() === q.toLowerCase());
    if (hit) { toggleLabel(ui.sel, hit.id); ui.labelQuery = ''; } else { ui.newName = q; ui.pop = 'labelNew'; }
    render();
  }
  if (e.target.id === 'composer' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendReply(ui.draft); ui.scrollEnd = true; render(); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'search') { ui.search = t.value; render(); }
  else if (t.id === 'labelq') { ui.labelQuery = t.value; render(); }
  else if (t.id === 'lname') { ui.newName = t.value; render(); }
  else if (t.id === 'mlname') { ui.m.newName = t.value; render(); }
  else if (t.id === 'composer') { ui.draft = t.value; const b = document.querySelector('[data-act="send"]'); if (b) b.disabled = !t.value.trim(); }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.act === 'step' && e.target.value) goStep(+e.target.value);
  if (e.target.id === 'shownew') { ui.showNew = e.target.checked; render(); }
});
document.addEventListener('submit', (e) => { if (e.target.dataset.form === 'newlabel') { e.preventDefault(); if (createLabel(ui.newName, ui.sel)) { ui.pop = 'labels'; ui.newName = ''; } render(); } });

const mm = location.hash.match(/step=(\d)/); const mv = location.hash.match(/view=(web|mobile|both)/);
seed(); if (mv) ui.view = mv[1];
if (mm) goStep(+mm[1]); else { ui.step = ''; render(); }
</script>
